name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag, for example v0.5.0
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== "v"+p.version) process.exit(1)'
      - run: python -m pip install -r python/requirements.lock
      - run: python -m unittest discover -s tests -q
        env:
          PYTHONPATH: python:tests
      - run: npm test
      - run: npm run check
      - run: swiftc python/Menu.swift -o /tmp/relay-menu-check
      - name: Publish with the repository's trusted identity
        run: npm publish --access public --provenance
